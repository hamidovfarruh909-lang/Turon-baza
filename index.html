<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abonentlar Bazasi</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #374151;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #4b5563;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            width: auto;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }

        .empty-message {
            text-align: center;
            color: #6b7280;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Abonentlar Bazasini Boshqarish Tizimi</h1>

        <!-- 1-Bo'lim: Ma'lumot kiritish -->
        <div class="card">
            <h2>Yangi abonent qo'shish</h2>
            <form id="subscriberForm">
                <div class="form-group">
                    <label for="name">Abonent ismi:</label>
                    <input type="text" id="name" placeholder="Masalan: Alisher Valiyev" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefon raqami:</label>
                    <input type="tel" id="phone" placeholder="Masalan: +998 90 123 45 67" required>
                </div>
                <div class="form-group">
                    <label for="address">Manzili:</label>
                    <input type="text" id="address" placeholder="Masalan: Toshkent sh, Chilonzor tumani" required>
                </div>
                <button type="submit">Abonentni qo'shish</button>
            </form>
        </div>

        <!-- 2-Bo'lim: Abonentlar jadvali -->
        <div class="card">
            <h2>Abonentlar ro'yxati</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Ismi</th>
                            <th>Telefon raqami</th>
                            <th>Manzili</th>
                            <th>Amallar</th>
                        </tr>
                    </thead>
                    <tbody id="subscriberTableBody">
                        <!-- JavaScript orqali ma'lumotlar shu yerga qo'shiladi -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Domen elementlarini olish
        const form = document.getElementById('subscriberForm');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const addressInput = document.getElementById('address');
        const tableBody = document.getElementById('subscriberTableBody');

        // Ma'lumotlarni LocalStorage dan olish yoki bo'sh massiv yaratish
        let subscribers = JSON.parse(localStorage.getItem('subscribers')) || [];

        // Jadvalni yangilovchi funksiya
        function renderTable() {
            tableBody.innerHTML = '';

            if (subscribers.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="empty-message">Hozircha abonentlar mavjud emas.</td></tr>`;
                return;
            }

            subscribers.forEach((sub, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${escapeHtml(sub.name)}</td>
                    <td>${escapeHtml(sub.phone)}</td>
                    <td>${escapeHtml(sub.address)}</td>
                    <td><button class="delete-btn" onclick="deleteSubscriber(${index})">O'chirish</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Forma yuborilganda ishlaydigan hodisa
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const newSubscriber = {
                name: nameInput.value.trim(),
                phone: phoneInput.value.trim(),
                address: addressInput.value.trim()
            };

            subscribers.push(newSubscriber);
            saveAndRender();

            // Formalarni tozalash
            form.reset();
        });

        // Abonentni o'chirish funksiyasi
        function deleteSubscriber(index) {
            if (confirm("Haqiqatan ham bu abonentni o'chirmoqchimisiz?")) {
                subscribers.splice(index, 1);
                saveAndRender();
            }
        }

        // Saqlash va yangilash
        function saveAndRender() {
            localStorage.setItem('subscribers', JSON.stringify(subscribers));
            renderTable();
        }

        // Xavfsizlik uchun HTML belgilarini tozalash
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Sahifa yuklanganda jadvalni chiqarish
        renderTable();
    </script>
</body>
</html>
